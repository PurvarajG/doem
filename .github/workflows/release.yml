name: Release Doem

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Apple Silicon DMG
    runs-on: macos-15

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Apple Silicon application
        run: npm run electron:build -- --publish never

      - name: Prepare the stable release asset
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist-electron/*arm64.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one Apple Silicon DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          cp "${dmgs[0]}" dist-electron/Doem-latest-arm64.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Put ahead of the generated notes. Doem is unsigned, so a downloaded
          # copy can be refused as "damaged" until the quarantine flag is cleared.
          body: |
            ## Install

            Download `Doem-latest-arm64.dmg`, open it and drag Doem into Applications. The first time, right-click Doem and choose **Open**.

            If macOS says Doem "is damaged and can't be opened", open Terminal, run this, then open Doem again:

            ```bash
            xattr -cr "/Applications/Doem.app"
            ```
          files: dist-electron/Doem-latest-arm64.dmg
